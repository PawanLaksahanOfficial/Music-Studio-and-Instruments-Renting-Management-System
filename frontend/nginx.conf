server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; index.html is revalidated every
    # request so a deploy is picked up immediately rather than from a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any path that isn't a real file falls back to
    # index.html so React Router handles it instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
